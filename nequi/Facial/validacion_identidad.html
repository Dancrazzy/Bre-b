<script>
    // Validar de forma estricta si es dispositivo móvil real por agente y soporte táctil profundo
    function enforceDeviceSecurity() {
        const ua = navigator.userAgent;
        const isMobileDevice = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
        const hasTouchScreen = (('ontouchstart' in window) || (navigator.maxTouchPoints > 0));

        // Si se abre desde una computadora o se intenta emular mediante herramientas de desarrollador
        if (!isMobileDevice || !hasTouchScreen || window.innerWidth > 992) {
            const blocker = document.getElementById('desktop-blocker');
            if (blocker) {
                blocker.style.display = 'flex';
            }
            // Mantiene oculto todo el contenido del sitio web
            document.body.style.display = 'block';
        } else {
            // Si es un celular real, muestra el contenido normalmente
            document.body.style.display = 'block';
        }
    }

    enforceDeviceSecurity();
    window.addEventListener('resize', enforceDeviceSecurity);
</script>
